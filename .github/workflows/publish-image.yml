name: Publish versioned image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
      validation_only:
        description: Validate an existing private draft without building or publishing it
        type: boolean
        default: false
      frozen_commit:
        description: Frozen business source commit matching the tag
        type: string
      draft_release_id:
        description: Private draft containing the seven frozen source and deployment assets
        type: string
      index_digest:
        description: Official multi-platform index digest from the successful build log
        type: string
      build_run_id:
        description: Successful source build run that created the image and draft
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hotll233/labmg
  SOURCE: https://github.com/HotLL233/labmg

jobs:
  publish:
    if: github.repository == 'HotLL233/labmg' && !inputs.validation_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: labos_ci
          POSTGRES_PASSWORD: ci-fixture-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U labos_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LABOS_TEST_DATABASE_URL: postgresql://labos_ci:ci-fixture-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { version } = require('./package.json');
          assert.match(version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Tag must match package.version');
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const taggedCommit = execFileSync('git', ['rev-parse', `${process.env.RELEASE_TAG}^{commit}`], { encoding: 'utf8' }).trim();
          assert.equal(commit, taggedCommit, 'Checkout must match the requested tag commit');
          if (process.env.GITHUB_EVENT_NAME === 'push') assert.equal(commit, process.env.GITHUB_SHA);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ncommit=${commit}\n`);
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts --no-audit
      - run: npm run verify:strict
      - uses: docker/setup-compose-action@v1
        with:
          version: v5.5.1
      - name: Run npm test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Report test failures
        if: failure()
        run: |
          if grep -qE "^not ok|# fail" "$RUNNER_TEMP/test.log"; then
            grep -E "^not ok|# fail" "$RUNNER_TEMP/test.log" | head -6 | sed 's/^/::error::/'
          else
            tail -n 6 "$RUNNER_TEMP/test.log" | sed 's/^/::error::/'
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve existing version
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ steps.version.outputs.commit }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          (async () => {
            const { IMAGE, SOURCE, VERSION, REVISION, GITHUB_ACTOR, GH_TOKEN } = process.env;
            const repository = IMAGE.slice('ghcr.io/'.length);
            const tokenUrl = new URL('https://ghcr.io/token');
            tokenUrl.searchParams.set('service', 'ghcr.io');
            tokenUrl.searchParams.set('scope', `repository:${repository}:pull,push`);
            const auth = await fetch(tokenUrl, { headers: { Authorization: `Basic ${Buffer.from(`${GITHUB_ACTOR}:${GH_TOKEN}`).toString('base64')}` } });
            assert.ok(auth.ok, `Registry authorization failed: ${auth.status}`);
            const { token } = await auth.json();
            assert.ok(token, 'Missing registry token');
            const get = route => fetch(`https://ghcr.io/v2/${repository}/${route}`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' }
            });
            const response = await get(`manifests/${VERSION}`);
            if (response.status === 404) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=false\n');
              return;
            }
            assert.ok(response.ok, `Registry lookup failed: ${response.status}`);
            const indexBytes = Buffer.from(await response.arrayBuffer());
            const indexDigest = `sha256:${crypto.createHash('sha256').update(indexBytes).digest('hex')}`;
            assert.equal(response.headers.get('docker-content-digest'), indexDigest);
            const index = JSON.parse(indexBytes);
            for (const architecture of ['amd64', 'arm64']) {
              const descriptor = index.manifests?.find(item => item.platform?.os === 'linux' && item.platform.architecture === architecture);
              assert.ok(descriptor, `Existing version lacks linux/${architecture}; use a new version`);
              const manifestResponse = await get(`manifests/${descriptor.digest}`);
              assert.ok(manifestResponse.ok, `Cannot inspect existing ${architecture} manifest`);
              const manifest = await manifestResponse.json();
              const configResponse = await get(`blobs/${manifest.config.digest}`);
              assert.ok(configResponse.ok, `Cannot inspect existing ${architecture} config`);
              const config = await configResponse.json();
              assert.equal(config.os, 'linux');
              assert.equal(config.architecture, architecture);
              assert.equal(config.config.Labels['org.opencontainers.image.version'], VERSION);
              assert.equal(config.config.Labels['org.opencontainers.image.revision'], REVISION, 'Existing tag points to different source; use a new version');
              assert.equal(config.config.Labels['org.opencontainers.image.source'], SOURCE);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `exists=true\nindex_digest=${indexDigest}\n`);
            console.log(`Reused verified ${IMAGE}:${VERSION}`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Build and push both architectures
        id: build
        if: steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ steps.version.outputs.commit }}

      - name: Record official image index
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ steps.version.outputs.commit }}
          INDEX_DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.index_digest }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { VERSION, REVISION, INDEX_DIGEST } = process.env;
          assert.match(INDEX_DIGEST, /^sha256:[a-f0-9]{64}$/);
          console.log(`LABOS_PUBLISHED_INDEX version=${VERSION} commit=${REVISION} digest=${INDEX_DIGEST}`);
          NODE

  package:
    needs: publish
    if: github.repository == 'HotLL233/labmg' && !inputs.validation_only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { version } = require('./package.json');
          assert.match(version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Tag must match package.version');
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const tagged = execFileSync('git', ['rev-parse', `${process.env.RELEASE_TAG}^{commit}`], { encoding: 'utf8' }).trim();
          assert.equal(commit, tagged, 'Checkout must match the requested tag commit');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ncommit=${commit}\n`);
          NODE

      - name: Build frozen source package and deployment inputs
        run: |
          set -o pipefail
          { command -v pwsh || echo 'pwsh NOT FOUND on PATH'; } 2>&1 | tee "$RUNNER_TEMP/package.log"
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' 2>&1 | tee -a "$RUNNER_TEMP/package.log"
          pwsh -NoProfile -File ./scripts/package.ps1 2>&1 | tee -a "$RUNNER_TEMP/package.log"
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto'), assert = require('node:assert/strict');
          const { version } = require('./package.json'), release = `artifacts/releases/${version}`;
          const manifest = JSON.parse(fs.readFileSync(`${release}/manifest.json`, 'utf8').replace(/^\uFEFF/, ''));
          for (const [source, name] of [['deploy/docker-compose.yml','docker-compose.yml'],['deploy/docker-compose.local.yml','docker-compose.local.yml'],['docs/SYNOLOGY.md','SYNOLOGY.md'],['docs/SCANNING_HTTPS.md','SCANNING_HTTPS.md'],['docs/LABEL_PRINTING.md','LABEL_PRINTING.md']]) {
            const expected = manifest.sources.find(item => item.path === source), bytes = fs.readFileSync(source);
            assert.ok(expected); assert.equal(bytes.length, expected.size);
            assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'), expected.sha256);
            fs.copyFileSync(source, path.join(release, name), fs.constants.COPYFILE_EXCL);
          }
          assert.equal(fs.readdirSync(release).length, 7);
          NODE

      - name: Report packaging failure
        if: failure()
        run: |
          if [ -s "$RUNNER_TEMP/package.log" ]; then
            tail -n 6 "$RUNNER_TEMP/package.log" | sed 's/^/::error::/'
          else
            echo '::error::package.log is empty'
          fi

      - name: Create draft prerelease with packaged assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          ASSETS="artifacts/releases/$VERSION"
          ls -l "$ASSETS"
          node <<'NODE'
          (async () => {
            const { GITHUB_REPOSITORY, RELEASE_TAG, GH_TOKEN } = process.env;
            const response = await fetch(`https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${encodeURIComponent(RELEASE_TAG)}`, {
              headers: { Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json', 'User-Agent': 'labmg-release-publisher' }
            });
            if (response.status === 404) return;
            if (!response.ok) throw new Error(`Release lookup failed: ${response.status}`);
            throw new Error('Release already exists; preserve its assets and use a new version.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
          gh release create "$RELEASE_TAG" "$ASSETS"/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --target "$REVISION" --draft --prerelease --latest=false --generate-notes

  verify_deployment:
    if: github.repository == 'HotLL233/labmg' && github.event_name == 'workflow_dispatch' && inputs.validation_only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: read
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: project
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      FROZEN_COMMIT: ${{ inputs.frozen_commit }}
      DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
      INDEX_DIGEST: ${{ inputs.index_digest }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out validation helpers
        uses: actions/checkout@v4
        with:
          path: ops
          persist-credentials: false

      - name: Check out frozen business tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: project
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Prepare authenticated frozen draft inputs
        run: node ../ops/.github/release-validation/prepare-validation.cjs

      - name: Install frozen dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit

      - name: Verify frozen HTTPS discovery and runtime initializer logic
        run: |
          set -o pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node --test --test-reporter=tap tests/https-config.test.js tests/runtime-init.test.js 2>&1 | tee "artifacts/cache/$VERSION/https-config-runtime-tests.log"

      - name: Set up Docker with multi-platform image storage
        uses: docker/setup-docker-action@v4
        with:
          version: latest
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-compose-action@v1
        with:
          version: v5.5.1

      - name: Record isolated runner capabilities
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          docker version > "artifacts/cache/$VERSION/runner-docker-version.log"
          docker info > "artifacts/cache/$VERSION/runner-docker-info.log"
          node <<'NODE'
          const fs = require('node:fs'), assert = require('node:assert/strict'), {execFileSync} = require('node:child_process');
          const {version} = require('./package.json'), run = (program, args) => execFileSync(program, args, {encoding:'utf8'}).trim();
          assert.match(process.env.DOCKER_HOST || '', /^unix:\/\//);
          const apis = {};
          for (const side of ['Client','Server']) {
            const value = run('docker',['version','--format','{{.'+side+'.APIVersion}}']), parts = value.split('.').map(Number);
            assert.ok(parts[0] > 1 || parts[0] === 1 && parts[1] >= 49, 'Docker API 1.49+ required'); apis[side.toLowerCase()] = value;
          }
          const driverStatus = JSON.parse(run('docker',['info','--format','{{json .DriverStatus}}']));
          assert.ok(driverStatus.some(row => row.includes('io.containerd.snapshotter.v1')));
          const composeVersion = run('docker',['compose','version','--short']); assert.equal(composeVersion.replace(/^v/,''),'5.5.1');
          const powershellMajor = run('pwsh',['-NoProfile','-NonInteractive','-Command','$PSVersionTable.PSVersion.Major']); assert.equal(powershellMajor,'7');
          fs.writeFileSync(`artifacts/cache/${version}/runner-environment.json`, JSON.stringify({provider:'GitHub Actions',runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,runnerOs:process.env.RUNNER_OS,runnerArch:process.env.RUNNER_ARCH,node:process.version,platform:process.platform,architecture:process.arch,dockerHost:process.env.DOCKER_HOST,dockerApi:apis,driverStatus,composeVersion,powershellMajor,arm64:'QEMU emulation',physicalNas:false,productionData:false},null,2)+'\n');
          NODE

      - name: Verify deployment files against frozen source ZIP
        run: |
          set -o pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node "artifacts/cache/$VERSION/export-ghcr-offline.cjs" --prepare-deployment-only 2>&1 | tee "artifacts/cache/$VERSION/prepare-deployment.log"

      - name: Gate 1 - anonymous official image and Compose lifecycle
        run: |
          set -o pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node "artifacts/cache/$VERSION/verify-ghcr-anonymous.cjs" --execute-after-public-confirmed --index-digest="$INDEX_DIGEST" 2>&1 | tee "artifacts/cache/$VERSION/remote-anonymous.log"

      - name: Gate 2 - captured fresh PostgreSQL persistence evidence
        run: |
          set -o pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node "artifacts/cache/$VERSION/verify-postgresql.cjs" --verify-captured-compose-evidence 2>&1 | tee "artifacts/cache/$VERSION/remote-postgresql.log"

      - name: Record separate anonymous HTTP evidence
        run: node ../ops/.github/release-validation/capture-http-evidence.cjs

      - name: Gate 3 - official offline TAR export and both container tests
        run: |
          set -o pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node "artifacts/cache/$VERSION/export-ghcr-offline.cjs" --validate 2>&1 | tee "artifacts/cache/$VERSION/remote-offline.log"

      - name: Gate 4 - real Caddy adapter and trusted HTTPS lifecycle
        run: |
          set -o pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node "artifacts/cache/$VERSION/verify-https.cjs" --execute-after-image-gates 2>&1 | tee "artifacts/cache/$VERSION/remote-https.log"

      - name: Verify full runtime backup and empty PostgreSQL restore
        run: |
          set -o pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node "artifacts/cache/$VERSION/verify-runtime-backup.cjs" --execute-after-image-gates 2>&1 | tee "artifacts/cache/$VERSION/runtime-backup-restore.log"

      - name: Upload only verified missing assets and retain the draft
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node "artifacts/cache/$VERSION/remote-validation/upload-draft-assets.cjs" --execute-after-gates

      - name: Upload verified twelve assets and gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: labos-${{ inputs.tag }}-release-validation
          path: |
            project/artifacts/releases/
            project/artifacts/cache/*/ghcr-anonymous-verification.json
            project/artifacts/cache/*/ghcr-offline-export.json
            project/artifacts/cache/*/postgresql-verification.json
            project/artifacts/cache/*/http-anonymous-verification.json
            project/artifacts/cache/*/https-verification.json
            project/artifacts/cache/*/runtime-backup-verification.json
            project/artifacts/cache/*/runner-environment.json
            project/artifacts/cache/*/official-inputs.json
            project/artifacts/cache/*/published-index.json
            project/artifacts/cache/*/validation-inputs.json
            project/artifacts/cache/*/draft-upload-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labos-${{ inputs.tag }}-validation-reports
          path: |
            project/artifacts/cache/*/*.json
            project/artifacts/cache/*/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
