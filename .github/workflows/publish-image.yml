name: Validate frozen 0.3.3 release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Frozen business source tag
        required: true
        default: v0.3.3
        type: string
      draft_release_id:
        description: Draft containing the five byte-exact source and deployment assets
        required: true
        default: '415656980'
        type: string
      index_digest:
        description: Previously published official multi-platform index digest
        required: true
        default: sha256:0ef478536f41367916e5966cf0f1381f8f561d3b2060c610656a591ec0be18c6
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: validate-frozen-labos-0.3.3
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'HotLL233/labmg'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: project
    env:
      FROZEN_COMMIT: fe4d6f454f793e1eceeb45ea7a13fc888db6d5d0
      RELEASE_TAG: ${{ inputs.tag }}
      INDEX_DIGEST: ${{ inputs.index_digest }}

    steps:
      - name: Check out operations helper ref
        uses: actions/checkout@v4
        with:
          path: ops
          persist-credentials: false

      - name: Check out frozen business tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v0.3.3
          path: project
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install frozen dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit

      - name: Prepare runner-only validation helpers
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          assert.equal(process.env.RELEASE_TAG,'v0.3.3');
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.FROZEN_COMMIT);
          assert.equal(execFileSync('git',['rev-parse','refs/tags/v0.3.3^{commit}'],{encoding:'utf8'}).trim(),process.env.FROZEN_COMMIT);
          assert.match(process.env.INDEX_DIGEST,/^sha256:[a-f0-9]{64}$/);
          assert.equal(require('./package.json').version,'0.3.3');
          const cache='artifacts/cache/0.3.3',source='../ops/.github/release-validation';
          fs.mkdirSync(path.join(cache,'validation'),{recursive:true});
          for(const name of ['verify-ghcr-anonymous.cjs','export-ghcr-offline.cjs','release-config.json','published-index.json'])fs.copyFileSync(path.join(source,name),path.join(cache,name),fs.constants.COPYFILE_EXCL);
          fs.copyFileSync(path.join(source,'upgrade-032-to-033.cjs'),path.join(cache,'validation/upgrade-032-to-033.cjs'),fs.constants.COPYFILE_EXCL);
          assert.equal(require('./'+cache+'/release-config.json').commit,process.env.FROZEN_COMMIT);
          assert.equal(require('./'+cache+'/published-index.json').indexDigest,process.env.INDEX_DIGEST);
          NODE

      - name: Download official draft inputs and original 0.3.2 Compose
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const {Readable,Transform}=require('node:stream'),{pipeline}=require('node:stream/promises');
          const repo='HotLL233/labmg',api='https://api.github.com/repos/'+repo,headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'labmg-release-validation'};
          let stage='draft-metadata';
          async function json(route){const r=await fetch(api+route,{headers,redirect:'error',signal:AbortSignal.timeout(30000)});assert.ok(r.ok,'Official API status '+r.status);return r.json();}
          async function download(asset,file){
            stage='asset-'+asset.id;
            let r=await fetch(api+'/releases/assets/'+asset.id,{headers:{...headers,Accept:'application/octet-stream'},redirect:'manual',signal:AbortSignal.timeout(300000)});
            if([301,302,303,307,308].includes(r.status)){
              const target=new URL(r.headers.get('location'));
              assert.ok(target.protocol==='https:'&&!target.username&&!target.password&&(target.hostname.endsWith('.githubusercontent.com')||target.hostname.endsWith('.blob.core.windows.net')),'Unexpected official asset redirect host');
              r=await fetch(target,{redirect:'error',signal:AbortSignal.timeout(300000)});
            }
            assert.ok(r.ok&&r.body,'Asset download failed');
            let size=0;const hash=crypto.createHash('sha256');fs.mkdirSync(path.dirname(file),{recursive:true});
            await pipeline(Readable.fromWeb(r.body),new Transform({transform(chunk,encoding,callback){size+=chunk.length;hash.update(chunk);callback(null,chunk);}}),fs.createWriteStream(file,{flags:'wx'}));
            const sha256=hash.digest('hex');assert.equal(size,asset.size);assert.equal(asset.digest,'sha256:'+sha256);
            return {name:path.basename(file),assetId:asset.id,size,sha256};
          }
          (async()=>{
            assert.match(process.env.DRAFT_RELEASE_ID,/^\d+$/);
            const draft=await json('/releases/'+process.env.DRAFT_RELEASE_ID);assert.equal(draft.draft,true);assert.equal(draft.tag_name,'v0.3.3');
            const expected=['labos-0.3.3.zip','manifest.json','docker-compose.yml','env.example','SYNOLOGY.md'];
            const assets=[];
            for(const name of expected){const matching=draft.assets.filter(a=>a.name===name);assert.equal(matching.length,1);assets.push(await download(matching[0],path.join('artifacts/releases/0.3.3',name==='env.example'?'.env.example':name)));}
            const manifest=JSON.parse(fs.readFileSync('artifacts/releases/0.3.3/manifest.json','utf8').replace(/^\uFEFF/,''));assert.equal(manifest.commit,process.env.FROZEN_COMMIT);assert.equal(manifest.version,'0.3.3');assert.equal(manifest.sha256,assets.find(a=>a.name===manifest.archive).sha256);
            const old=await json('/releases/415629591');assert.equal(old.tag_name,'v0.3.2');const original=old.assets.filter(a=>a.name==='docker-compose.yml');assert.equal(original.length,1);
            const oldCompose=await download(original[0],'artifacts/releases/0.3.2/docker-compose.yml');
            fs.writeFileSync('artifacts/cache/0.3.3/official-inputs.json',JSON.stringify({repository:repo,draftReleaseId:draft.id,commit:process.env.FROZEN_COMMIT,assets,oldCompose,environment:'GitHub Actions hosted Ubuntu'},null,2)+'\n');
          })().catch(()=>{console.error('Official input preparation failed at '+stage+'; credentials and redirect URLs are omitted.');process.exitCode=1;});
          NODE

      - name: Set up current Docker with multi-platform image storage
        id: docker
        uses: docker/setup-docker-action@v4
        with:
          version: latest
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}

      - name: Enable ARM64 container emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Record runner and Docker capabilities
        run: |
          mkdir -p artifacts/cache/0.3.3
          docker version > artifacts/cache/0.3.3/runner-docker-version.log
          docker info > artifacts/cache/0.3.3/runner-docker-info.log
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const run=(name,args)=>execFileSync(name,args,{encoding:'utf8'}).trim();
          assert.match(process.env.DOCKER_HOST||'',/^unix:\/\//);
          const apis={};
          for(const side of ['Client','Server']){const value=run('docker',['version','--format','{{.'+side+'.APIVersion}}']),parts=value.split('.').map(Number);assert.ok(parts[0]>1||(parts[0]===1&&parts[1]>=49),'Docker '+side+' API 1.49+ required');apis[side.toLowerCase()]=value;}
          const driverStatus=JSON.parse(run('docker',['info','--format','{{json .DriverStatus}}']));
          assert.ok(driverStatus.some(row=>row.includes('io.containerd.snapshotter.v1')),'containerd image store is required');
          const powershellMajor=run('pwsh',['-NoProfile','-NonInteractive','-Command','$PSVersionTable.PSVersion.Major']);assert.equal(powershellMajor,'7');
          fs.writeFileSync('artifacts/cache/0.3.3/runner-environment.json',JSON.stringify({provider:'GitHub Actions',runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,runnerOs:process.env.RUNNER_OS,runnerArch:process.env.RUNNER_ARCH,node:process.version,platform:process.platform,architecture:process.arch,dockerHost:process.env.DOCKER_HOST,dockerApi:apis,driverStatus,powershellMajor,arm64:'QEMU emulation',physicalNas:false,productionData:false},null,2)+'\n');
          NODE

      - name: Verify deployment files against frozen source ZIP
        run: node artifacts/cache/0.3.3/export-ghcr-offline.cjs --prepare-deployment-only 2>&1 | tee artifacts/cache/0.3.3/prepare-deployment.log

      - name: Gate 1 - anonymous official image and Compose lifecycle
        run: node artifacts/cache/0.3.3/verify-ghcr-anonymous.cjs --execute-after-public-confirmed --index-digest="$INDEX_DIGEST" 2>&1 | tee artifacts/cache/0.3.3/remote-anonymous.log

      - name: Gate 2 - original 0.3.2 Compose and same-volume upgrade
        run: node artifacts/cache/0.3.3/validation/upgrade-032-to-033.cjs "$FROZEN_COMMIT" "$INDEX_DIGEST" 2>&1 | tee artifacts/cache/0.3.3/remote-upgrade.log

      - name: Gate 3 - official offline TAR export and both container tests
        run: node artifacts/cache/0.3.3/export-ghcr-offline.cjs --validate 2>&1 | tee artifacts/cache/0.3.3/remote-offline.log

      - name: Upload verified ten release assets and canonical gate reports
        uses: actions/upload-artifact@v4
        with:
          name: labos-0.3.3-release-validation
          path: |
            project/artifacts/releases/0.3.3/
            project/artifacts/cache/0.3.3/ghcr-anonymous-verification.json
            project/artifacts/cache/0.3.3/ghcr-offline-export.json
            project/artifacts/cache/0.3.3/upgrade-verification.json
            project/artifacts/cache/0.3.3/runner-environment.json
            project/artifacts/cache/0.3.3/official-inputs.json
          include-hidden-files: true
          compression-level: 6
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labos-0.3.3-validation-reports
          path: |
            project/artifacts/cache/0.3.3/*.json
            project/artifacts/cache/0.3.3/*.log
            project/artifacts/cache/0.3.3/validation/upgrade-*/report.json
            project/artifacts/cache/0.3.3/validation/upgrade-*/events.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
