<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LabOS 实验室综合管理系统</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/material.css"></head><body><div id="app"></div><dialog id="login"><form id="login-form"><h1>LabOS</h1><p>实验室综合管理系统</p><label>用户名<input name="username" value="admin" required></label><label>密码<input name="password" type="password" value="admin123" required></label><button class="primary">登录系统</button><small>首次登录：admin / admin123，请及时修改。</small></form></dialog><dialog id="editor"><form id="record-form"><div class="modal-head"><div><h2 id="edit-title">新建记录</h2><p>所有业务模块统一使用记录、附件和审计日志。</p></div><button type="button" class="x" onclick="editor.close()">×</button></div><div id="fields" class="grid"></div><p id="record-error" role="alert" hidden></p><footer><button type="button" class="ghost" onclick="editor.close()">取消</button><button type="button" class="ghost" id="reload-record" hidden>放弃输入并重新加载</button><button type="submit" class="primary">保存</button></footer></form></dialog><dialog id="detail"><div class="modal-head"><div><h2 id="detail-title"></h2><p id="detail-code"></p></div><button class="x" onclick="detail.close()">×</button></div><div id="detail-body"></div><h3>附件</h3><label class="upload">＋ 上传文件<input id="file" type="file" hidden></label><div id="files"></div><footer><button class="ghost" onclick="window.print()">打印</button><button class="primary" onclick="detail.close()">完成</button></footer></dialog><div id="toast"></div><script src="/app.js"></script><script src="/material.js"></script><script src="/permission.js"></script><script src="/archive.js"></script><script src="/audit.js"></script><script src="/datahub.js"></script><script src="/asset.js"></script><script src="/contract.js"></script><script src="/quality.js"></script><script>start()</script></body></html>
