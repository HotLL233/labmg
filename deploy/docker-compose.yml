# 在线版：自动拉取 LabOS 0.14.9（GHCR）、PostgreSQL 18 和 Caddy 镜像。
# 自动识别群晖主局域网 IPv4，无需手填 IP；手机仍须信任本实例根证书。
# 无需另放 .env 或 Caddyfile；已有 .env 的数据路径及 UID/GID 覆盖仍有效。
# 首次安装使用全新 PostgreSQL 18；已有 PG18 更新保留 runtime/、https/，手机须信任根证书。
version: '3.8'

services:
  labos-init:
    image: "${LABOS_IMAGE:-ghcr.io/hotll233/labmg:0.14.9}"
    user: "0:0"
    restart: "no"
    network_mode: host
    command: ["node", "src/init-runtime.js"]
    environment:
      LABOS_UID: "${LABOS_UID:-1000}"
      LABOS_GID: "${LABOS_GID:-1000}"
      LABOS_HTTPS_HOST: "${LABOS_HTTPS_HOST:-auto}"
    healthcheck:
      disable: true
    volumes:
      - "${LABOS_DATA_DIR:-./runtime}:/var/lib/labos"

  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    depends_on:
      labos-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: labos
      POSTGRES_DB: labos
      POSTGRES_PASSWORD_FILE: /run/labos-secrets/postgres-password
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - "${LABOS_DATA_DIR:-./runtime}/postgres:/var/lib/postgresql"
      - "${LABOS_DATA_DIR:-./runtime}/secrets:/run/labos-secrets:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labos -d labos"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  labos:
    image: "${LABOS_IMAGE:-ghcr.io/hotll233/labmg:0.14.9}"
    user: "${LABOS_UID:-1000}:${LABOS_GID:-1000}"
    depends_on:
      labos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    ports:
      - "${LABOS_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      LABOS_RUNTIME_DIR: /var/lib/labos
      LABOS_ADMIN_USER: "${LABOS_ADMIN_USER:-admin}"
      PGHOST: postgres
      PGDATABASE: labos
      PGUSER: labos
      LABOS_DATABASE_PASSWORD_FILE: /var/lib/labos/secrets/postgres-password
    volumes:
      - "${LABOS_DATA_DIR:-./runtime}:/var/lib/labos"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  labos-https:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      labos-init:
        condition: service_completed_successfully
      labos:
        condition: service_started
    ports:
      - "${LABOS_HTTPS_PORT:-8443}:443"
    environment:
      XDG_DATA_HOME: /var/lib/labos-https/data
      XDG_CONFIG_HOME: /var/lib/labos-https/config
    command: ["caddy", "run", "--config", "/etc/labos-https/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - "./https:/var/lib/labos-https"
      - "${LABOS_DATA_DIR:-./runtime}/https-config:/etc/labos-https:ro"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
