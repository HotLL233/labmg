# LabOS 0.6.0：PostgreSQL、附件及自动生成的数据库口令固定保存在 runtime/。
# 全新部署使用；不要将旧版 SQLite 运行目录当成已迁移的 PostgreSQL 数据。
version: '3.8'

services:
  labos-init:
    image: "${LABOS_IMAGE:-ghcr.io/hotll233/labmg:0.6.0}"
    user: "0:0"
    restart: "no"
    command: ["node", "src/init-runtime.js"]
    environment:
      LABOS_UID: "${LABOS_UID:-1000}"
      LABOS_GID: "${LABOS_GID:-1000}"
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: "${LABOS_DATA_DIR:-./runtime}"
        target: /var/lib/labos
        bind:
          create_host_path: true

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    depends_on:
      labos-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: labos
      POSTGRES_DB: labos
      POSTGRES_PASSWORD_FILE: /run/labos-secrets/postgres-password
    volumes:
      - type: bind
        source: "${LABOS_DATA_DIR:-./runtime}/postgres"
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
      - type: bind
        source: "${LABOS_DATA_DIR:-./runtime}/secrets"
        target: /run/labos-secrets
        read_only: true
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labos -d labos"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  labos:
    image: "${LABOS_IMAGE:-ghcr.io/hotll233/labmg:0.6.0}"
    user: "${LABOS_UID:-1000}:${LABOS_GID:-1000}"
    depends_on:
      labos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    ports:
      - "${LABOS_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      LABOS_RUNTIME_DIR: /var/lib/labos
      LABOS_ADMIN_USER: "${LABOS_ADMIN_USER:-admin}"
      PGHOST: postgres
      PGDATABASE: labos
      PGUSER: labos
      LABOS_DATABASE_PASSWORD_FILE: /var/lib/labos/secrets/postgres-password
    volumes:
      - type: bind
        source: "${LABOS_DATA_DIR:-./runtime}"
        target: /var/lib/labos
        bind:
          create_host_path: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
