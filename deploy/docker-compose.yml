# 0.3.2 开发模板：配套镜像尚未发布。现有部署继续使用 v0.3.1 Release 的文件。
version: '3.8'

services:
  labos-init:
    image: "${LABOS_IMAGE:-ghcr.io/hotll233/labmg:0.3.2}"
    user: "0:0"
    restart: "no"
    command: ["node", "src/init-runtime.js"]
    environment:
      LABOS_UID: "${LABOS_UID:-1000}"
      LABOS_GID: "${LABOS_GID:-1000}"
    healthcheck:
      disable: true
    volumes:
      - "${LABOS_DATA_DIR:-labos-runtime-0.3.2}:/var/lib/labos"

  labos:
    image: "${LABOS_IMAGE:-ghcr.io/hotll233/labmg:0.3.2}"
    user: "${LABOS_UID:-1000}:${LABOS_GID:-1000}"
    depends_on:
      labos-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    ports:
      - "${LABOS_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      LABOS_RUNTIME_DIR: /var/lib/labos
      LABOS_ADMIN_USER: "${LABOS_ADMIN_USER:-admin}"
    volumes:
      - "${LABOS_DATA_DIR:-labos-runtime-0.3.2}:/var/lib/labos"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  labos-runtime-0.3.2: {}
