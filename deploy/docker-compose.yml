version: '3.8'

services:
  labos:
    image: labos:0.2.0-rc.2
    user: "${LABOS_UID:-1000}:${LABOS_GID:-1000}"
    init: true
    restart: unless-stopped
    ports:
      - "${LABOS_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      LABOS_RUNTIME_DIR: /var/lib/labos
      LABOS_ADMIN_USER: "${LABOS_ADMIN_USER:-admin}"
      LABOS_ADMIN_PASSWORD: "${LABOS_ADMIN_PASSWORD:?必须设置 LABOS_ADMIN_PASSWORD}"
    volumes:
      - "${LABOS_DATA_DIR:-../var/docker/0.2.0-rc.2}:/var/lib/labos"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
