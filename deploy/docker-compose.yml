# LabOS 0.5.1：数据固定在本 YML 同目录的 runtime/，不随版本换目录。
# 已有部署先停服完整备份；原卷不会自动迁入 runtime/，迁移步骤见 docs/SYNOLOGY.md。
version: '3.8'

services:
  labos-init:
    image: "${LABOS_IMAGE:-ghcr.io/hotll233/labmg:0.5.1}"
    user: "0:0"
    restart: "no"
    command: ["node", "src/init-runtime.js"]
    environment:
      LABOS_UID: "${LABOS_UID:-1000}"
      LABOS_GID: "${LABOS_GID:-1000}"
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: "${LABOS_DATA_DIR:-./runtime}"
        target: /var/lib/labos
        bind:
          create_host_path: true

  labos:
    image: "${LABOS_IMAGE:-ghcr.io/hotll233/labmg:0.5.1}"
    user: "${LABOS_UID:-1000}:${LABOS_GID:-1000}"
    depends_on:
      labos-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    ports:
      - "${LABOS_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      LABOS_RUNTIME_DIR: /var/lib/labos
      LABOS_ADMIN_USER: "${LABOS_ADMIN_USER:-admin}"
    volumes:
      - type: bind
        source: "${LABOS_DATA_DIR:-./runtime}"
        target: /var/lib/labos
        bind:
          create_host_path: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
