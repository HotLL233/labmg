lc(100vw - 32px))}.dialog-wide .dialog-body{padding:20px 0}.dialog-wide .batch-summary,.dialog-wide .dialog-message{margin-left:25px;margin-right:25px}.toast{position:fixed;bottom:28px;left:calc(50% + 108px);transform:translateX(-50%);background:#233958;color:white;box-shadow:0 5px 25px #19385830;border-radius:9px;padding:14px 21px;max-width:min(600px,90vw);font-size:13px;line-height:1.7;z-index:10}.toast:empty{display:none}.role-note{color:#8b98ab;font-size:11px;padding:0 23px 15px}.divider{height:1px;background:var(--line)}

<body>
<div class="app">
  <aside class="sidebar" aria-label="物资管理导航">
    <div><div class="brand"><span class="brand-mark" aria-hidden="true">L</span>LabOS</div><div class="brand-sub">实验室综合管理系统</div></div>
    <div><div class="nav-caption">物资管理</div><nav class="nav"><button type="button" data-page="requests" class="active"><span class="nav-icon" aria-hidden="true">▤</span>物资申报</button><button type="button" data-page="acceptance"><span class="nav-icon" aria-hidden="true">✓</span>验收</button><button type="button" data-page="inventory"><span class="nav-icon" aria-hidden="true">▦</span>库存</button></nav></div>
    <div class="sidebar-foot">LABORATORY OPERATIONS<br>让每一份物资去向清晰<br><span style="color:#6e85a7">交互设计预览 · 2026.10</span></div>
  </aside>
  <div class="workspace">
    <div class="prototype-bar"><span><span class="prototype-chip">交互原型</span>模拟数据与权限 · 不连接真实业务 · 刷新后还原</span><a href="../MATERIAL_WORKFLOW.md">查看设计说明 ↗</a></div>
    <header class="topbar"><div class="breadcrumb">工作台 <span aria-hidden="true"> / </span> 物资管理 <span aria-hidden="true"> / </span> <span id="crumb">物资申报</span></div><div class="role-switch"><label for="role">体验角色</label><select id="role"><option value="material">物资管理员 · 王敏（MATERIAL）</option><option value="user">普通用户 · 林晓</option></select><span class="avatar" id="avatar" aria-hidden="true">王</span></div></header>
    <main class="main" id="main"></main>
  </div>
</div>
<dialog id="form-dialog" aria-labelledby="form-title"><form id="business-form"><div class="dialog-head"><h2 id="form-title"></h2><button type="button" class="close" data-action="close-form" aria-label="关闭对话框">×</button></div><div class="dialog-body"><div id="form-intro"></div><div class="form-grid" id="form-fields"></div><p class="form-error" id="form-error" role="alert"></p></div><div class="dialog-actions"><button type="button" data-action="close-form">取消</button><button type="submit" class="primary" id="form-save">保存</button></div></form></dialog>
<dialog id="lock-dialog" aria-labelledby="lock-title"><div class="dialog-head"><h2 id="lock-title">确认提交整张申报单</h2><button type="button" class="close" data-action="close-lock" aria-label="关闭确认">×</button></div><div class="dialog-body"><div class="lock-symbol" aria-hidden="true">🔒</div><strong id="lock-order"></strong><p class="dialog-message">提交后，整张申报单及全部明细将<strong class="danger">永久锁定</strong>，任何用户（包括物资管理员）均不能新增、修改或删除明细，也不能撤回。</p><p class="dialog-message">请确认已汇总所有人的申报内容。提交后进入验收环节。</p></div><div class="dialog-actions"><button type="button" data-action="close-lock">返回核对</button><button type="button" class="primary" data-action="confirm-lock" id="confirm-lock">确认提交并永久锁定</button></div></dialog>
<dialog id="detail-dialog" class="dialog-wide" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title">批次明细</h2><button type="button" class="close" data-action="close-detail" aria-label="关闭明细">×</button></div><div class="dialog-body" id="detail-body"></div><div class="dialog-actions"><button type="button" data-action="close-detail">关闭</button></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatScaled(value,digits,fixed=false){const raw=String(value).padStart(digits+1,'0'),whole=raw.slice(0,-digits).replace(/\B(?=(\d{3})+(?!\d))/g,','),fraction=fixed?raw.slice(-digits):raw.slice(-digits).replace(/0+$/,'');return whole+(fraction?'.'+fraction:'');}
const quantity = value => formatScaled(value,3);
const money = value => role === 'material' ? '¥'+formatScaled(value,2,true) : '无权限';
const today = () => new Date().toLocaleDateString('sv-SE');
let role = 'material', page = 'requests', activeOrderId = null, query = '', filter = 'all', sequence = 100, formContext = null, lockOrderId = null, toastTimer;
const currentUser = () => role === 'material' ? {id:'u1',name:'王敏'} : {id:'u2',name:'林晓'};
const orders = [
  {id:1,no:'WZ-202610-003',title:'十月实验室日常物资申报',date:'2026-10-17',creator:'王敏',status:'draft',lines:[
    {id:11,code:'MAT-R002',name:'无水乙醇',spec:'500 mL/瓶 · 分析纯',unit:'瓶',warehouse:'试剂库',qtyM:24000,purpose:'样品前处理',authorId:'u2',author:'林晓'},
    {id:12,code:'MAT-C008',name:'移液吸头',spec:'200 μL · 1000支/袋',unit:'袋',warehouse:'耗材库',qtyM:10000,purpose:'常规移液耗材补充',authorId:'u3',author:'周衡'},
    {id:13,code:'MAT-C003',name:'一次性丁腈手套',spec:'M码 · 100只/盒',unit:'盒',warehouse:'耗材库',qtyM:20000,purpose:'实验防护',authorId:'u1',author:'王敏'}]},
  {id:2,no:'WZ-202610-002',title:'液相检测项目试剂与耗材',date:'2026-10-12',submitted:'2026-10-13',creator:'王敏',status:'submitted',lines:[
    {id:21,code:'MAT-R001',name:'乙腈（色谱纯）',spec:'4 L/瓶',unit:'瓶',warehouse:'试剂库',qtyM:12000,purpose:'液相色谱检测',authorId:'u2',author:'林晓'},
    {id:22,code:'MAT-C003',name:'一次性丁腈手套',spec:'M码 · 100只/盒',unit:'盒',warehouse:'耗材库',qtyM:30000,purpose:'实验防护',authorId:'u3',author:'周衡'}]},
  {id:3,no:'WZ-202610-001',title:'细胞实验耗材补充',date:'2026-10-08',submitted:'2026-10-09',creator:'林晓',status:'submitted',lines:[
    {id:31,code:'MAT-C005',name:'离心管',spec:'15 mL · 50支/袋',unit:'袋',warehouse:'耗材库',qtyM:16000,purpose:'细胞分离与样品保存',authorId:'u2',author:'林晓'}]}
];
const receipts = [
  {id:41,lineId:21,orderId:2,qtyM:5000,cents:225000,date:'2026-10-14',batch:'YS-20261014-01',operator:'王敏'},
  {id:42,lineId:21,orderId:2,qtyM:3000,cents:135000,date:'2026-10-16',batch:'YS-20261016-01',operator:'王敏'},
  {id:43,lineId:22,orderId:2,qtyM:30000,cents:96000,date:'2026-10-14',batch:'YS-20261014-02',operator:'王敏'}
];
const stocks = [];
function stockKey(item) { return JSON.stringify([item.code.trim().toUpperCase(),item.spec.trim(),item.unit.trim(),item.warehouse.trim()]); }
function safeSum(a,b) { const n=a+b; if(!Number.isSafeInteger(n)) throw Error('累计数值过大，请拆分处理。'); return n; }
function total(items,key) { return items.reduce((sum,item)=>safeSum(sum,item[key]),0); }
function canAddStock(item,qtyM,cents) { const stock=stocks.find(s=>stockKey(s)===stockKey(item)); if(stock){safeSum(total(stock.batches,'qtyM'),qtyM);safeSum(total(stock.batches,'cents'),cents);} safeSum(total(stocks.flatMap(s=>s.batches),'cents'),cents); }
function addStock(item,batch) { canAddStock(item,batch.qtyM,batch.cents); let stock=stocks.find(s=>stockKey(s)===stockKey(item)); if(!stock){stock={id:++sequence,code:item.code.trim().toUpperCase(),name:item.name,spec:item.spec.trim(),unit:item.unit.trim(),warehouse:item.warehouse.trim(),batches:[]};stocks.push(stock);}stock.batches.push(batch); }
addStock({code:'MAT-R001',name:'乙腈（色谱纯）',spec:'4 L/瓶',unit:'瓶',warehouse:'试剂库'}, {batch:'QC-20261001-01',date:'2026-10-01',qtyM:4000,cents:176000,source:'期初登记',operator:'王敏'});
addStock({code:'MAT-R001',name:'乙腈（色谱纯）',spec:'4 L/瓶',unit:'瓶',warehouse:'备用库'}, {batch:'QC-20261001-02',date:'2026-10-01',qtyM:2000,cents:88000,source:'期初登记',operator:'王敏'});
for(const receipt of receipts){const order=orders.find(o=>o.id===receipt.orderId),line=order.lines.find(l=>l.id===receipt.lineId);addStock(line,{...receipt,source:order.no+' · 验收入库'});}
const getOrder = id => orders.find(o=>o.id===Number(id));
const accepted = line => total(receipts.filter(r=>r.lineId===line.id),'qtyM');
const receiptStatus = line => accepted(line) === 0 ? 'pending' : accepted(line) < line.qtyM ? 'partial' : 'done';
const submittedRows = () => orders.filter(o=>o.status==='submitted').flatMap(order=>order.lines.map(line=>({order,line})));
const canEdit = (order,line) => order.status==='draft' && (role==='material'||line.authorId===currentUser().id);
const badge = (label,tone='') => `<span class="badge ${tone}">${escapeHtml(label)}</span>`;
const statusBadge = line => ({pending:badge('未验收','amber'),partial:badge('部分验收','blue'),done:badge('已验收','green')})[receiptStatus(line)];
const emptyRow = columns => `<tr><td colspan="${columns}" class="empty">没有找到符合条件的记录，请调整搜索条件。</td></tr>`;
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;toastTimer=setTimeout(()=>{$('toast').textContent='';},5500);}
function parseScaled(raw,digits,label) { const text=String(raw).trim();if(!new RegExp('^\\d+(?:\\.\\d{1,'+digits+'})?$').test(text))throw Error(label+'须为正数，最多 '+digits+' 位小数。');const parts=text.split('.');const value=Number(parts[0]+(parts[1]||'').padEnd(digits,'0'));if(!Number.isSafeInteger(value)||value<=0)throw Error(label+'须大于零且在安全数值范围内。');return value; }
function value(form,name){return String(form.get(name)||'').trim();}
function requiredText(form,name,label,max=100){const text=value(form,name);if(!text||text.length>max)throw Error(label+'不能为空，最多 '+max+' 个字符。');return text;}
function header(){const labels={requests:['物资申报','从协同申报到验收入库，每一步都有据可查。'],acceptance:['验收','分批记录实际合格数量，验收确认后自动入库。'],inventory:['库存','按物资与仓库汇总，保留每一次入库批次。']};const item=labels[page];$('crumb').textContent=item[0];return `<div class="page-heading"><div><h1>${item[0]}</h1><p class="subtitle">${item[1]}</p></div><div class="date">${escapeHtml(today())} · 物资工作台</div></div>`;}
function metrics(){const pending=submittedRows().filter(({line})=>receiptStatus(line)!=='done').length;return `<div class="metrics">${[['▤','协同申报草稿',orders.filter(o=>o.status==='draft').length,'单'],['✓','已提交申报',orders.filter(o=>o.status==='submitted').length,'单'],['◷','待完成验收',pending,'项'],['▦','库存物资',stocks.length,'项']].map(([icon,label,num,unit])=>`<div class="metric"><span class="metric-icon" aria-hidden="true">${icon}</span><div><div class="metric-label">${label}</div><div class="metric-value">${num}<span>${unit}</span></div></div></div>`).join('')}</div>`;}
function toolbar(options,placeholder){return `<div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><span class="sr-only">搜索</span><input id="search" type="search" placeholder="${placeholder}" value="${escapeHtml(query)}" autocomplete="off"></label><label><span class="sr-only">筛选记录</span><select id="filter">${options.map(([key,label])=>`<option value="${escapeHtml(key)}"${filter===key?' selected':''}>${escapeHtml(label)}</option>`).join('')}</select></label><span class="result-count" id="result-count"></span></div>`;}
function render(){document.querySelectorAll('[data-page]').forEach(button=>{button.classList.toggle('active',button.dataset.page===page);if(button.dataset.page===page)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});let content='';if(page==='requests'&&activeOrderId)content=orderView();else if(page==='requests')content=`<section class="panel" aria-label="申报单列表"><div class="panel-top"><div><h2>申报单列表</h2><p class="subtitle">多人协同填写，由物资管理员统一提交</p></div><div class="actions"><button data-action="history">历史查询</button><button data-action="export">导出 Excel</button><button class="primary" data-action="new-order">＋ 新建申报单</button></div></div>${toolbar([['all','全部状态'],['draft','草稿'],['submitted','已提交']],'搜索单号、申报主题或申报人')}<div id="results"></div><div class="panel-bottom"><span>提交前可协作填报，提交后整单永久锁定</span><span>演示数据 · 共 ${orders.length} 张申报单</span></div></section>`;else if(page==='acceptance')content=`<section class="panel" aria-label="历史申报明细验收"><div class="panel-top"><div><h2>待验收与历史明细</h2><p class="subtitle">展示所有已提交申报单的物资明细</p></div><button data-action="export">导出 Excel</button></div><div class="hint">每次填写<strong>实际合格数量</strong>与<strong>本批含税总金额</strong>，可分批验收。确认后自动加入对应仓库库存。</div>${role==='user'?'<div class="role-note">当前为普通用户，可查看验收记录；办理验收由物资管理员操作。</div>':''}${toolbar([['all','全部验收状态'],['pending','未验收'],['partial','部分验收'],['done','已验收']],'搜索物资、编码、单号或规格')}<div id="results"></div><div class="panel-bottom"><span>历史明细持续保留 · 已验收记录不可重复入库</span><span>数量最多 3 位小数</span></div></section>`;else content=`<section class="panel" aria-label="库存列表"><div class="panel-top"><div><h2>库存台账</h2><p class="subtitle">相同编码、规格、单位及仓库合并，明细保留批次</p></div><div class="actions"><button data-action="export">导出 Excel</button><button class="primary" data-action="initial-stock"${role==='user'?' disabled':''}>＋ 期初库存登记</button></div></div>${role==='user'?'<div class="role-note">当前为普通用户，可查询库存及批次；期初登记由物资管理员操作。</div>':''}${toolbar([['all','全部仓库'],...Array.from(new Set(stocks.map(s=>s.warehouse))).map(w=>[w,w])],'搜索物资名称、编码或规格')}<div id="results"></div><div class="panel-bottom"><span>库存总金额 <strong class="money">${money(total(stocks.flatMap(s=>s.batches),'cents'))}</strong></span><span>不同单位分别统计，仓库之间不合并</span></div></section>`;$('main').innerHTML=header()+metrics()+content+'<footer class="footer"><span>LabOS · 物资管理工作流</span><span>界面原型 · 权限为模拟效果 · 无真实业务数据 · 刷新即还原</span></footer>';if($('results'))renderResults();}
function renderResults(){let rows,html;if(page==='requests'){rows=orders.filter(o=>(filter==='all'||o.status===filter)&&[o.no,o.title,o.creator,...o.lines.map(l=>l.name)].join(' ').toLowerCase().includes(query.toLowerCase()));html=`<table><thead><tr><th>申报单 / 主题</th><th>创建人</th><th>物资项数</th><th>创建日期</th><th>单据状态</th><th>操作</th></tr></thead><tbody>${rows.map(o=>`<tr><td><div class="cell-main">${escapeHtml(o.title)}</div><div class="cell-sub code">${escapeHtml(o.no)}</div></td><td>${escapeHtml(o.creator)}</td><td>${o.lines.length} 项</td><td class="numeric">${escapeHtml(o.date)}</td><td>${o.status==='draft'?badge('草稿','amber'):badge('已提交 · 已锁定','blue')}</td><td><button class="ghost small" data-action="open-order" data-id="${o.id}">${o.status==='draft'?'填写明细':'查看明细'} →</button></td></tr>`).join('')||emptyRow(6)}</tbody></table>`;}else if(page==='acceptance'){rows=submittedRows().filter(({order,line})=>(filter==='all'||receiptStatus(line)===filter)&&[order.no,line.code,line.name,line.spec].join(' ').toLowerCase().includes(query.toLowerCase()));html=`<table><thead><tr><th>物资名称 / 编码</th><th>规格 / 来源单据</th><th>申报数量</th><th>已验收 / 剩余</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(({order,line})=>`<tr><td><div class="cell-main">${escapeHtml(line.name)}</div><div class="cell-sub code">${escapeHtml(line.code)} · ${escapeHtml(line.warehouse)}</div></td><td><div>${escapeHtml(line.spec)}</div><div class="cell-sub">${escapeHtml(order.no)}</div></td><td class="numeric">${quantity(line.qtyM)} ${escapeHtml(line.unit)}</td><td class="numeric"><span>${quantity(accepted(line))} / <strong>${quantity(line.qtyM-accepted(line))}</strong></span><div class="progress-track"><div class="progress-fill" style="width:${Math.round(accepted(line)/line.qtyM*100)}%"></div></div></td><td>${statusBadge(line)}</td><td><div class="actions"><button class="small" data-action="receive" data-id="${line.id}" data-order="${order.id}"${role!=='material'||receiptStatus(line)==='done'?' disabled':''}>办理验收</button><button class="ghost small" data-action="receipts" data-id="${line.id}" data-order="${order.id}">记录</button></div></td></tr>`).join('')||emptyRow(6)}</tbody></table>`;}else{rows=stocks.filter(s=>(filter==='all'||s.warehouse===filter)&&[s.code,s.name,s.spec].join(' ').toLowerCase().includes(query.toLowerCase()));html=`<table><thead><tr><th>物资名称 / 编码</th><th>规格</th><th>仓库</th><th>库存数量</th><th>库存总金额</th><th>保留批次</th><th>操作</th></tr></thead><tbody>${rows.map(s=>`<tr><td><div class="cell-main">${escapeHtml(s.name)}</div><div class="cell-sub code">${escapeHtml(s.code)}</div></td><td>${escapeHtml(s.spec)}</td><td>${badge(s.warehouse,'blue')}</td><td class="numeric"><strong>${quantity(total(s.batches,'qtyM'))}</strong> ${escapeHtml(s.unit)}</td><td class="numeric money">${money(total(s.batches,'cents'))}</td><td>${s.batches.length} 批</td><td><button class="ghost small" data-action="stock-detail" data-id="${s.id}">批次明细 →</button></td></tr>`).join('')||emptyRow(7)}</tbody></table>`;}$('results').innerHTML='<div class="table-wrap">'+html+'</div>';$('result-count').textContent='共 '+rows.length+' 条记录';}
function orderView(){const order=getOrder(activeOrderId);const locked=order.status==='submitted';return `<button class="ghost back" data-action="back">← 返回申报单列表</button><section class="panel" aria-label="申报单明细"><div class="panel-top"><div><h2>${escapeHtml(order.title)}</h2><p class="subtitle code">${escapeHtml(order.no)}</p></div><div class="actions">${locked?badge('已提交 · 永久锁定','blue'):`<button data-action="add-line" data-order="${order.id}">＋ 添加物资</button><button class="primary" data-action="submit-order" data-order="${order.id}"${role!=='material'||!order.lines.length?' disabled':''}>提交整张申报单</button>`}<button data-action="export">导出 Excel</button></div></div><div class="order-meta"><span>创建人：${escapeHtml(order.creator)}</span><span>创建日期：${escapeHtml(order.date)}</span><span>物资明细：${order.lines.length} 项</span>${locked?`<span>提交日期：${escapeHtml(order.submitted)}</span>`:''}</div><div class="hint ${locked?'locked':''}">${locked?'🔒 本单及全部明细已永久锁定。物资管理员也不能修改；请在「验收」中办理分批验收。':role==='material'?'协同草稿：所有登录用户均可添加明细。物资管理员可修改全部草稿行，并在核对后统一提交。':'协同草稿：你可以添加物资，仅能修改或删除自己创建的明细。整单提交由物资管理员操作。'}</div><div class="table-wrap"><table><thead><tr><th>物资名称 / 编码</th><th>规格 / 单位</th><th>申报数量</th><th>入库仓库</th><th>申报人</th><th>用途</th><th>操作</th></tr></thead><tbody>${order.lines.map(line=>`<tr><td><div class="cell-main">${escapeHtml(line.name)}</div><div class="cell-sub code">${escapeHtml(line.code)}</div></td><td>${escapeHtml(line.spec)}<div class="cell-sub">单位：${escapeHtml(line.unit)}</div></td><td class="numeric">${quantity(line.qtyM)}</td><td>${escapeHtml(line.warehouse)}</td><td>${escapeHtml(line.author)}${line.authorId===currentUser().id?' <span class="cell-sub">（我）</span>':''}</td><td style="white-space:normal;max-width:180px">${escapeHtml(line.purpose)}</td><td>${canEdit(order,line)?`<div class="actions"><button class="ghost small" data-action="edit-line" data-id="${line.id}" data-order="${order.id}">编辑</button><button class="ghost small danger" data-action="delete-line" data-id="${line.id}" data-order="${order.id}">删除</button></div>`:`<span class="cell-sub">${locked?'已锁定':'仅创建人可改'}</span>`}</td></tr>`).join('')||emptyRow(7)}</tbody></table></div><div class="panel-bottom"><span>${locked?'已提交记录纳入历史查询':'草稿保存即时生效 · 提交前请完整核对'}</span><span>数量最多 3 位小数</span></div></section>`;}
function field(name,label,type='text',initial='',full=false,note=''){return `<label class="field${full?' full':''}"><span>${label}</span><input name="${name}" type="${type}" value="${escapeHtml(initial)}" required maxlength="${name==='purpose'?200:100}"${type==='text'&&['qty','amount'].includes(name)?' inputmode="decimal"':''}>${note?`<span class="field-note">${note}</span>`:''}</label>`;}
function warehouseField(initial='耗材库'){return `<label class="field"><span>入库仓库</span><select name="warehouse" required>${['耗材库','试剂库','备用库'].map(w=>`<option${w===initial?' selected':''}>${w}</option>`).join('')}</select></label>`;}
function materialFields(item={}){return field('code','物资编码','text',item.code||'')+field('name','物资名称','text',item.name||'')+field('spec','规格','text',item.spec||'')+field('unit','单位','text',item.unit||'')+warehouseField(item.warehouse)+field('qty','数量','text',item.qtyM?quantity(item.qtyM).replaceAll(',',''):'',false,'正数，最多 3 位小数');}
function openForm(context,title,fields,intro='',saveLabel='保存'){formContext={...context,busy:false};$('form-title').textContent=title;$('form-fields').innerHTML=fields;$('form-intro').innerHTML=intro;$('form-error').textContent='';$('form-save').textContent=saveLabel;$('form-save').disabled=false;$('form-dialog').showModal();}
function closeForm(){$('form-dialog').close();formContext=null;}
function showBatches(title,item,batches){$('detail-title').textContent=title;$('detail-body').innerHTML=`<div class="batch-summary"><strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.spec)}</span><span>${escapeHtml(item.warehouse)}</span></div><p class="dialog-message">共 ${batches.length} 批 · 累计数量 ${quantity(total(batches,'qtyM'))} ${escapeHtml(item.unit)} · 含税总金额 ${money(total(batches,'cents'))}</p><div class="table-wrap"><table><thead><tr><th>批次 / 日期</th><th>来源</th><th>数量</th><th>含税总金额</th><th>办理人</th></tr></thead><tbody>${batches.map(b=>`<tr><td><div class="code">${escapeHtml(b.batch)}</div><div class="cell-sub">${escapeHtml(b.date)}</div></td><td>${escapeHtml(b.source||'验收入库')}</td><td>${quantity(b.qtyM)} ${escapeHtml(item.unit)}</td><td>${money(b.cents)}</td><td>${escapeHtml(b.operator)}</td></tr>`).join('')||emptyRow(5)}</tbody></table></div>`;$('detail-dialog').showModal();}
document.addEventListener('click',event=>{const nav=event.target.closest('[data-page]');if(nav){page=nav.dataset.page;activeOrderId=null;query='';filter='all';render();return;}const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action,order=getOrder(button.dataset.order),line=order?.lines.find(l=>l.id===Number(button.dataset.id));
  if(action==='close-form'){closeForm();return;}if(action==='close-lock'){$('lock-dialog').close();lockOrderId=null;return;}if(action==='close-detail'){$('detail-dialog').close();return;}
  try{
    if(action==='export'){toast(role==='material'?'正式开发将提供 .xlsx 文件导出；此交互原型不下载模拟 Excel 文件。':'当前角色没有 Excel 导出权限，请由获授权的物资管理员操作。');return;}
    if(action==='history'){filter='submitted';query='';render();toast('已切换至历史记录，可按主题、单号或申报人搜索。');return;}

    if(action==='new-order'){openForm({mode:'order'},'新建申报单',field('title','申报主题','text','',true,'例如：十月实验室日常物资申报'),'','创建并填写明细');return;}
    if(action==='add-line'||action==='edit-line'){if(!order||order.status!=='draft')throw Error('申报单已锁定，不能修改。');if(action==='edit-line'&&(!line||!canEdit(order,line)))throw Error('只能修改自己创建的草稿行。');openForm({mode:'line',orderId:order.id,lineId:line?.id},line?'编辑申报明细':'添加申报物资',materialFields(line)+field('purpose','用途说明','text',line?.purpose||'',true));return;}
    if(action==='delete-line'){if(!line||!canEdit(order,line))throw Error('该明细不可删除。');order.lines=order.lines.filter(l=>l.id!==line.id);render();toast('明细已从草稿中删除。');return;}
    if(action==='submit-order'){if(role!=='material'||!order||order.status!=='draft'||!order.lines.length)throw Error('仅物资管理员可提交有明细的草稿。');lockOrderId=order.id;$('lock-order').textContent=order.no+' · '+order.title+'（'+order.lines.length+' 项物资）';$('confirm-lock').disabled=false;$('lock-dialog').showModal();return;}
    if(action==='confirm-lock'){const target=getOrder(lockOrderId);if(role!=='material'||!target||target.status!=='draft'||!target.lines.length)throw Error('单据状态或权限已变化，不能重复提交。');$('confirm-lock').disabled=true;target.status='submitted';target.submitted=today();lockOrderId=null;$('lock-dialog').close();render();toast('整张申报单已提交并永久锁定，待办理验收。');return;}
    if(action==='receive'){if(role!=='material'||!order||order.status!=='submitted'||!line||accepted(line)>=line.qtyM)throw Error('当前明细不可办理验收。');const remaining=line.qtyM-accepted(line);openForm({mode:'receive',orderId:order.id,lineId:line.id},'办理分批验收',field('qty','本次实际合格数量（'+escapeHtml(line.unit)+'）','text','',false,'最多 '+quantity(remaining)+' '+escapeHtml(line.unit))+field('amount','本批含税总金额（元）','text','',false,'填写本批总额，最多 2 位小数'),`<div class="hint"><strong>${escapeHtml(line.name)}</strong> · ${escapeHtml(line.spec)}<br>来源 ${escapeHtml(order.no)} · 尚余 ${quantity(remaining)} ${escapeHtml(line.unit)}<br>确认后自动入库至「${escapeHtml(line.warehouse)}」。原型仅支持正金额；正式版零金额须填写原因。</div>`,'确认验收并入库');return;}
    if(action==='receipts'){if(line)showBatches('验收记录',line,receipts.filter(r=>r.lineId===line.id).map(r=>({...r,source:order.no})));return;}
    if(action==='initial-stock'){if(role!=='material')throw Error('仅物资管理员可登记期初库存。');openForm({mode:'initial'},'登记期初库存',materialFields()+field('amount','含税总金额（元）','text','',true,'本批库存总额，最多 2 位小数'),'<div class="hint">编码、规格、单位与仓库全部一致时合并库存；每次登记均保留独立来源批次。不同仓库单独记账。<br><strong>仅用于开始新账：</strong>正式业务启用后关闭期初登记。原型为体验操作持续开放。</div>','确认登记');return;}
    if(action==='stock-detail'){const stock=stocks.find(s=>s.id===Number(button.dataset.id));if(stock)showBatches('库存批次明细',stock,stock.batches);}
  }catch(error){toast(error.message);}
});
$('business-form').addEventListener('submit',event=>{event.preventDefault();const context=formContext;if(!context||context.busy)return;context.busy=true;$('form-save').disabled=true;$('form-error').textContent='';try{const form=new FormData(event.target),user=currentUser();let message='';
  if(context.mode==='order'){const title=requiredText(form,'title','申报主题');const id=++sequence;orders.unshift({id,no:'WZ-'+today().replaceAll('-','')+'-'+id,title,date:today(),creator:user.name,status:'draft',lines:[]});activeOrderId=id;message='申报单草稿已创建，可继续添加物资。';}

  if(context.mode==='receive'){const order=getOrder(context.orderId),line=order?.lines.find(l=>l.id===context.lineId);if(role!=='material'||!order||order.status!=='submitted'||!line)throw Error('当前权限或单据状态不允许验收。');const qtyM=parseScaled(value(form,'qty'),3,'本次实际合格数量'),cents=parseScaled(value(form,'amount'),2,'本批含税总金额');if(qtyM>line.qtyM-accepted(line))throw Error('本次验收数量超过剩余可验收数量。');canAddStock(line,qtyM,cents);const id=++sequence,batch='YS-'+today().replaceAll('-','')+'-'+id,receipt={id,lineId:line.id,orderId:order.id,qtyM,cents,date:today(),batch,operator:user.name};addStock(line,{...receipt,source:order.no+' · 验收入库'});receipts.push(receipt);message='验收成功：'+quantity(qtyM)+' '+line.unit+' 已入库至'+line.warehouse+'。';}
  if(context.mode==='initial'){if(role!=='material')throw Error('仅物资管理员可登记期初库存。');const item={code:requiredText(form,'code','物资编码').toUpperCase(),name:requiredText(form,'name','物资名称'),spec:requiredText(form,'spec','规格'),unit:requiredText(form,'unit','单位',20),warehouse:requiredText(form,'warehouse','仓库',30)},qtyM=parseScaled(value(form,'qty'),3,'数量'),cents=parseScaled(value(form,'amount'),2,'含税总金额');canAddStock(item,qtyM,cents);const matched=stocks.some(s=>stockKey(s)===stockKey(item));addStock(item,{batch:'QC-'+today().replaceAll('-','')+'-'+(++sequence),date:today(),qtyM,cents,source:'期初登记',operator:user.name});message=matched?'期初库存已合并，独立批次已保留。':'期初库存已登记，并创建新物资库存项。';}
  closeForm();render();toast(message);
}catch(error){$('form-error').textContent=error.message;context.busy=false;$('form-save').disabled=false;}});
$('main').addEventListener('input',event=>{if(event.target.id==='search'){query=event.target.value;renderResults();}});
$('main').addEventListener('change',event=>{if(event.target.id==='filter'){filter=event.target.value;renderResults();}});
$('role').addEventListener('change',event=>{role=event.target.value;closeForm();$('lock-dialog').close();$('detail-dialog').close();lockOrderId=null;$('avatar').textContent=currentUser().name[0];render();toast('已切换为'+(role==='material'?'物资管理员，可办理提交、验收与期初登记。':'普通用户，仅可修改自己创建的草稿明细。'));});
$('form-dialog').addEventListener('close',()=>{formContext=null;});
$('lock-dialog').addEventListener('close',()=>{lockOrderId=null;});
render();
</script>
</body>
</html>
