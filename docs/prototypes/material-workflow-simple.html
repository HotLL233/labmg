    function extraFields(line){const entry=draft(line),isZero=/^0+(?:\.0{1,2})?$/.test(entry.amount.trim()),expanded=state.expanded.has(line.id);const html=`<tr class="detail-row" id="difference-${line.id}" data-detail-for="${line.id}"${expanded?'':' hidden'}><td colspan="8"><div class="line-extra">${!line.catalogId?matchingFields(line):''}${rowField(line,'batch','生产批号／批次')}${rowField(line,'expiry','有效期','date')}${rowField(line,'manufacturer','厂家')}${rowField(line,'rejectedQuantity','本次拒收数量','number','min="0" step="0.001"')}${rowField(line,'rejectedReason','拒收原因')}${rowField(line,'differenceReason','差异说明')}${rowField(line,'note','本次备注')}<label class="field" id="zero-reason-${line.id}"${isZero?'':' hidden'}><span>零金额原因</span><input data-line-id="${line.id}" data-field="zeroReason" value="${escape(entry.zeroReason)}" aria-label="${escape(line.name+' · 零金额原因')}" placeholder="合格入库金额为0时必填"></label><p class="note field full">合格数量在上方行内填写。拒收留记录、不抵减需求；已入账记录在历史中查看。</p></div></td></tr>`;return canReceive()?html:html.replace(/<(input|select)\b/g,"<$1 disabled");}

    const settingsLabels={catalog:'物资信息库',categories:'物资分类',regions:'归属区域',warehouses:'仓库',places:'存放库位',numbering:'编号规则',labels:'标签模板',barcodes:'包装码绑定'};

    function settingContent(){

    function parseScaled(raw,digits){const text=String(raw).trim();if(!new RegExp('^\\d+(?:\\.\\d{1,'+digits+'})?$').test(text))return null;const [whole,fraction='']=text.split('.');const value=Number(whole+fraction.padEnd(digits,'0'));return Number.isSafeInteger(value)?value:null;}
    function prepare(line){const entry=draft(line),errors=[],fail=(field,message)=>errors.push({lineId:line.id,field,message:line.name+'：'+message});let catalog=line.catalogId?catalogs.find(row=>row.id===line.catalogId):catalogs.find(row=>row.id===entry.catalogChoice);if(!line.catalogId){if(entry.catalogChoice==='__new__'){if(!canManage())fail('catalogChoice','没有新建物资信息权限');if(!entry.newName.trim())fail('newName','请填写新物资名称');if(!entry.newSpec.trim())fail('newSpec','请填写规格');if(!entry.newUnit.trim())fail('newUnit','请填写基本单位');catalog={id:null,name:entry.newName.trim(),spec:entry.newSpec.trim(),unit:entry.newUnit.trim(),tracking:entry.newTracking,category:line.category};const existing=catalogs.find(row=>row.name===catalog.name&&row.spec===catalog.spec&&row.unit===catalog.unit);if(existing){if(existing.tracking!==catalog.tracking)fail('newTracking','同名同规格已有资料的管理方式不同，请选择并核对已有物资');catalog=existing;}}else if(!catalog)fail('catalogChoice','请在当前行选择已有物资，或就地新建');}
      const quantityM=parseScaled(entry.quantity,3),rejectedM=parseScaled(entry.rejectedQuantity||'0',3),amountCents=parseScaled(entry.amount,2);if(quantityM===null)fail('quantity','本次合格数量须为非负数字，最多3位小数');if(rejectedM===null)fail('rejectedQuantity','拒收数量须为非负数字，最多3位小数');if(quantityM!==null&&rejectedM!==null){if(quantityM===0&&rejectedM===0)fail('quantity','合格与拒收数量至少一项大于0');if(quantityM+rejectedM>remaining(line))fail('quantity','合格与拒收合计不能超过剩余 '+n(remaining(line))+' '+line.unit);if(catalog?.tracking==='unit'&&(quantityM%1000||rejectedM%1000))fail('quantity','逐件物资须为整数瓶／件');if(catalog?.tracking==='unit'&&quantityM>1000000)fail('quantity','单次逐件验收最多1000件');}
      if(catalog&&catalog.unit!==line.unit)fail("catalogChoice","关联物资的基本单位须与原申报一致；不能静默转换原申报数量");if(amountCents===null)fail('amount','请填写本次实际含税总金额，不能留空或用未知金额代填0');if(quantityM===0&&amountCents!==null&&amountCents!==0)fail('amount','仅拒收时，合格入库金额须为0');if(quantityM>0&&amountCents===0&&!entry.zeroReason.trim())fail('zeroReason','零金额合格入库须填写原因');if(rejectedM>0&&!entry.rejectedReason.trim())fail('rejectedReason','有拒收数量时须填写拒收原因');if(entry.expiry&&!/^\d{4}-\d{2}-\d{2}$/.test(entry.expiry))fail('expiry','有效期格式不正确');return {line,entry,catalog,quantityM,rejectedM,amountCents,errors};
    }
    function receive(lineIds,consistent=false){clearStatus();clearErrors();if(!canReceive()){showStatus('当前身份无验收权限。请使用物资管理员演示身份。');return;}const order=getOrder(),lines=order.lines.filter(line=>lineIds.includes(line.id));if(!lines.length){showStatus('请先选择待验收物资。');return;}const prepared=lines.map(prepare);const errors=prepared.flatMap(row=>row.errors);for(const row of prepared){if(remaining(row.line)<=0)errors.push({lineId:row.line.id,message:row.line.name+'：已完成，不能重复入库'});if(consistent&&(row.quantityM!==remaining(row.line)||row.rejectedM!==0))errors.push({lineId:row.line.id,field:'quantity',message:row.line.name+'：存在到货差异，请使用逐行或选中项入库，不自动覆盖当前输入'});}
      const unitTotal=prepared.reduce((sum,row)=>sum+(row.catalog?.tracking==="unit"&&Number.isSafeInteger(row.quantityM)?row.quantityM/1000:0),0);if(unitTotal>1000)errors.push({message:"本次批量合格入库共 "+unitTotal+" 件，单次总数不能超过1000件"});const positions=new Map();for(const row of prepared){if(!(row.quantityM>0)||!row.catalog)continue;const catalogKey=row.catalog.id||[row.catalog.name,row.catalog.spec,row.catalog.unit].join('|');const key=[catalogKey,row.line.region,row.line.warehouse,row.entry.batch,row.entry.expiry].join('|');if(positions.has(key)&&positions.get(key)!==row.entry.location.trim())errors.push({lineId:row.line.id,field:'location',message:row.line.name+'：同批次存放位置必须一致'});positions.set(key,row.entry.location.trim());}
      if(errors.length){showErrors(errors);return;}
      // All checks above are read-only. Apply the complete selection only after every row passes.
      const receiptIds=[];let newUnits=0;for(const row of prepared){const {line,entry,quantityM,rejectedM,amountCents}=row;let catalog=row.catalog;if(!catalog.id){catalog=catalogs.find(item=>item.name===catalog.name&&item.spec===catalog.spec&&item.unit===catalog.unit)||{...catalog,id:'C'+state.catalogSequence,code:'MAT-'+String(state.catalogSequence).padStart(6,'0')};if(!catalogs.some(item=>item.id===catalog.id)){state.catalogSequence++;catalogs.push(catalog);}}line.catalogId=catalog.id;line.tracking=catalog.tracking;const codes=[];if(quantityM>0&&catalog.tracking==='unit')for(let index=0;index<quantityM/1000;index++)codes.push('LAB-'+String(state.unitSequence++).padStart(6,'0'));newUnits+=codes.length;
        const event={id:'YS-'+String(state.sequence++).padStart(4,'0'),orderId:order.id,lineId:line.id,name:catalog.name,spec:catalog.spec,unit:catalog.unit,quantityM,rejectedM,amountCents,location:entry.location.trim(),batch:entry.batch.trim(),expiry:entry.expiry,manufacturer:entry.manufacturer.trim(),note:entry.note.trim(),reason:[entry.differenceReason,entry.rejectedReason,entry.zeroReason].filter(Boolean).join('；'),date:today,actor:'林舟',codes};history.unshift(event);if(quantityM>0)receiptIds.push(event.id);
        if(quantityM>0){const stock=inventory.find(item=>item.catalogId===catalog.id&&item.region===line.region&&item.warehouse===line.warehouse&&item.batch===event.batch&&item.expiry===event.expiry);if(stock){stock.qtyM+=quantityM;stock.amountCents+=amountCents;stock.location=event.location;}else inventory.push({id:'S'+(inventory.length+101),catalogId:catalog.id,name:catalog.name,spec:catalog.spec,unit:catalog.unit,tracking:catalog.tracking,qtyM:quantityM,amountCents,region:line.region,warehouse:line.warehouse,batch:event.batch,expiry:event.expiry,location:event.location,manufacturer:event.manufacturer,note:event.note,receivedDate:today});}
        line.acceptedM+=quantityM;state.dirty.delete(line.id);state.selected.delete(line.id);state.expanded.delete(line.id);entry.catalogChoice=catalog.id;entry.quantity=n(remaining(line));entry.amount='';entry.rejectedQuantity='0';entry.rejectedReason='';entry.zeroReason='';entry.differenceReason='';entry.note='';
      }
      render();showStatus(`已保存 ${prepared.length} 条验收记录，合格部分已进入演示库存${newUnits?'，生成 '+newUnits+' 个独立单件码':''}。${orderDone(order)?'本单已完成，禁止重复入库。':'剩余需求继续待验；拒收不抵减需求。'}`,receiptIds);
    }
    function refreshHints(lineId){const line=getLine(lineId),entry=draft(line),zero=/^0+(?:\.0{1,2})?$/.test(entry.amount.trim()),zeroBox=$('#zero-reason-'+lineId);if(zeroBox)zeroBox.hidden=!zero;if(zero){state.expanded.add(lineId);const extra=$('#difference-'+lineId);if(extra)extra.hidden=false;const toggle=document.querySelector(`[data-action="difference"][data-line-id="${lineId}"]`);toggle?.setAttribute('aria-expanded','true');}}
    function focusError(node){const lineId=node.dataset.lineId;if(!lineId)return;state.expanded.add(lineId);const extra=$('#difference-'+lineId);if(extra)extra.hidden=false;const target=document.querySelector(`[data-line-id="${lineId}"][data-field="${node.dataset.targetField}"]`)||document.querySelector(`tr[data-line-id="${lineId}"] input`);target?.focus();target?.scrollIntoView({block:'nearest',inline:'nearest'});}
    function requestIssue(stockId){const stock=inventory.find(row=>row.id===stockId);if(!stock)return;state.stockExpanded=stock.id;render();const tableRow=document.querySelector(`tr[data-stock-id="${stock.id}"]`),next=tableRow?.nextElementSibling;if(!next)return;next.innerHTML=`<td colspan="7"><form id="issue-form" data-stock-id="${stock.id}" class="line-extra"><label class="field"><span>申请数量（${escape(stock.unit)}）</span><input name="quantity" type="number" min="1" step="${stock.tracking==='unit'?'1':'0.001'}" value="1" required></label><label class="field span2"><span>领用用途</span><input name="purpose" placeholder="填写实际用途" required maxlength="1000"></label><div class="actions">${button('cancel-issue','取消',`data-stock-id="${stock.id}"`,'small')}<button type="submit" class="primary small">提交领用申请</button></div><p class="note field full">已定位 ${escape(stock.warehouse+'／'+stock.region+' · '+stock.batch)}，余额 ${n(stock.qtyM)} ${stock.unit}。申请不预占库存；发放需扫码核对实际实物。</p></form></td>`;next.querySelector('input')?.focus();}
    document.addEventListener('input',event=>{const target=event.target;if(target.matches('[data-line-id][data-field]')){const line=getLine(target.dataset.lineId);if(!line||remaining(line)<=0||!canReceive())return;draft(line)[target.dataset.field]=target.value;state.dirty.add(line.id);refreshHints(line.id);}if(target.id==='order-search'){state.orderQuery=target.value;state.orderPage=1;const caret=target.selectionStart;render();const input=$('#order-search');input?.focus();input?.setSelectionRange(caret,caret);}if(target.id==='stock-search'){const query=target.value.trim().toLowerCase();document.querySelectorAll('#stock-table tbody>tr[data-stock-id]').forEach(row=>{const stock=inventory.find(item=>item.id===row.dataset.stockId);row.hidden=![stock.name,stock.spec,stock.location].some(value=>value.toLowerCase().includes(query));if(row.nextElementSibling?.classList.contains('detail-row'))row.nextElementSibling.hidden=row.hidden;});}});
    document.addEventListener('change',event=>{const target=event.target;if(target.dataset.field==='catalogChoice'){const line=getLine(target.dataset.lineId);if(line){draft(line).catalogChoice=target.value;state.dirty.add(line.id);state.expanded.add(line.id);render();}}if(target.dataset.selectLine){if(target.checked)state.selected.add(target.dataset.selectLine);else state.selected.delete(target.dataset.selectLine);const order=getOrder();const selected=order.lines.filter(line=>remaining(line)>0&&state.selected.has(line.id)).length;$('#selection-status').textContent=`已选 ${selected} 项 · 单次统一校验，失败不入库`;$('#select-all').checked=selected>0&&selected===order.lines.filter(line=>remaining(line)>0).length;document.querySelector('[data-action="receive-selected"]').disabled=!canReceive()||!selected;}if(target.id==='select-all'){getOrder().lines.filter(line=>remaining(line)>0).forEach(line=>{if(target.checked)state.selected.add(line.id);else state.selected.delete(line.id);});render();}if(target.id==='history-all'){state.historyAll=target.checked;render();}if(target.id==='demo-role'){const role=target.value;target.value=state.role;navigate(()=>{clearStatus();state.role=role;clearErrors();render();showStatus('已切换演示身份；原输入保留，写操作继续按角色限制。');},'切换演示身份');}});
    document.addEventListener('submit',event=>{if(event.target.id!=='issue-form')return;event.preventDefault();const form=event.target,stock=inventory.find(row=>row.id===form.dataset.stockId),data=new FormData(form),quantity=String(data.get('quantity')||''),qtyM=parseScaled(quantity,3),purpose=String(data.get('purpose')||'').trim();if(!stock||!qtyM||qtyM>stock.qtyM||(stock.tracking==='unit'&&qtyM%1000)||!purpose){showStatus('请核对申请数量、整件要求和用途；申请数量不能超过当前余额。');return;}issueRecords.unshift({id:'LY-'+String(issueRecords.length+1).padStart(4,'0'),name:stock.name,quantity,unit:stock.unit,purpose,status:'待发放',actor:'当前演示人员'});state.stockExpanded=null;state.inventoryMode='issues';render();showStatus('领用申请已加入演示记录，库存数量保持，等待管理员发放。');});
    document.addEventListener('click',event=>{const node=event.target.closest('[data-action]');if(!node||node.disabled)return;const action=node.dataset.action;
      if(action==='page'){goPage(node.dataset.page);return;}if(action==='order'){chooseOrder(node.dataset.orderId);return;}if(action==='order-prev'||action==='order-next'){state.orderPage+=action==='order-next'?1:-1;render();return;}
      if(action==='confirm-switch'){const next=state.pending;state.pending=null;$('#switch-confirm').hidden=true;next?.();return;}if(action==='cancel-switch'){state.pending=null;$('#switch-confirm').hidden=true;return;}
      if(action==='original'){state.original=!state.original;render();return;}if(action==='acceptance-mode'){navigate(()=>{state.acceptanceMode=node.dataset.mode;state.stockExpanded=null;clearErrors();render();},'查看'+(node.dataset.mode==='history'?'验收历史':'验收明细'));return;}
      if(action==='difference'||action==='match'){const line=getLine(node.dataset.lineId);if(remaining(line)===0){navigate(()=>{state.acceptanceMode='history';render();},'查看本项历史');return;}if(action==='match')state.expanded.add(line.id);else if(state.expanded.has(line.id))state.expanded.delete(line.id);else state.expanded.add(line.id);render();return;}
      if(action==='receive-one'){receive([node.dataset.lineId]);return;}if(action==='receive-selected'){receive(getOrder().lines.filter(line=>state.selected.has(line.id)&&remaining(line)>0).map(line=>line.id));return;}if(action==='receive-all'){receive(getOrder().lines.filter(line=>remaining(line)>0).map(line=>line.id),true);return;}if(action==='focus-error'){focusError(node);return;}
      if(action==='history-detail'){state.stockExpanded=state.stockExpanded===node.dataset.historyId?null:node.dataset.historyId;render();return;}if(action==='inventory-mode'){navigate(()=>{state.inventoryMode=node.dataset.mode;state.stockExpanded=null;render();},'切换库存分区');return;}
      if(action==='stock-detail'){state.stockExpanded=state.stockExpanded===node.dataset.stockId?null:node.dataset.stockId;render();return;}if(action==='stock-issue'){navigate(()=>requestIssue(node.dataset.stockId),'申请本批物资');return;}if(action==='cancel-issue'){state.stockExpanded=null;render();return;}
      if(action==='setting'){navigate(()=>{state.setting=node.dataset.setting;render();},'切换设置分区');return;}if(action==='return-work'){goPage('acceptance');return;}if(action==='request-detail'){state.requestExpanded=state.requestExpanded===node.dataset.orderId?null:node.dataset.orderId;render();return;}if(action==='go-acceptance'){navigate(()=>{clearStatus();state.orderId=node.dataset.orderId;state.page='acceptance';state.acceptanceMode='receive';render();},'办理本单验收');return;}
      if(action==='not-simulated'){showStatus(node.dataset.message);return;}if(action==='setting-demo'){showStatus((canManage()?'该配置继续按原权限维护，保留原因与历史引用。':'当前身份只读，无配置维护权限。')+' 此原型展示入口与组织方式，未模拟配置写入。');return;}
      if(action==='print-latest'){const ids=(node.dataset.eventIds||'').split(',');const events=history.filter(row=>ids.includes(row.id));showStatus('仅本次 '+events.length+' 条入库记录，共 '+events.reduce((sum,row)=>sum+row.codes.length,0)+' 个单件码；标签与系统打印入口演示，不生成可扫描码、不连接USB打印机。');return;}if(action==='label-demo'){const sample=$('#label-example');if(sample){sample.hidden=!sample.hidden;return;}showStatus('单件标签入口保留：每瓶／件独立码、二维码＋基础信息、系统打印。本原型不生成可扫描码或连接USB打印机。');return;}
      if(action==='scan-receive'||action==='scan-issue'){showStatus('扫码入口保留：相机、图片与手输；此离线原型不访问摄像头。正式验收按单定位，领用按实际批次与单件码核对。');return;}
      if(action==='logout'){if(state.loggedOut)return;navigate(()=>{state.loggedOut=true;$('#app').innerHTML='<section class="panel demo-logout"><h2>已退出演示</h2><p>此处未调用真实注销接口。重新进入后仍保留当前内存记录，刷新才重置。</p>'+button('reenter','重新进入演示','','primary')+'</section>';},'退出演示');return;}if(action==='reenter'){state.loggedOut=false;$('#app').innerHTML=appMarkup;render();showStatus('已重新进入演示，当前内存记录与未入库输入保留。');}
    });
    window.addEventListener('beforeunload',event=>{if(state.dirty.size&&!state.loggedOut){event.preventDefault();event.returnValue='';}});
    const mobile=matchMedia('(max-width:767px)');mobile.addEventListener('change',event=>{const details=$('#order-picker');if(details)details.open=!event.matches;});
    // Read-only inspection surface for prototype QA; no production API, storage or credentials.
    window.materialPrototype={snapshot:()=>JSON.parse(JSON.stringify({page:state.page,orderId:state.orderId,role:state.role,orders,inventory,history,issues:issueRecords,dirty:[...state.dirty]}))};
    render();
  })();
  </script>
</body>
</html>
